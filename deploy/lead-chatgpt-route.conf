# Private service-to-service API. OAuth remains loopback-only on 47922.
location = /webhook/vertux-lead-chatgpt {
    allow 95.181.213.124;
    deny all;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:47923/webhook/vertux-lead-chatgpt;
    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Content-Type $http_content_type;
    proxy_set_header Content-Length $http_content_length;
    proxy_read_timeout 165s;
    proxy_connect_timeout 3s;
    proxy_buffering off;
    access_log off;
}
