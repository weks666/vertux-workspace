# Include only in the existing Workspace data-plane HTTPS virtual host.
# Example upstream port must match LEAD_PORT. This is not a deploy script.
location = /webhook/vertux-lead-intelligence {
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:47921;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Origin $http_origin;
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;
    add_header Cache-Control "no-store" always;
    add_header X-Vertux-Lead "v1" always;
}
