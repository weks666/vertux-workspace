# Included only inside the existing nexus.vertux.online HTTPS server.
location = /api/workspace-trainer {
    client_max_body_size 64k;
    proxy_pass https://zxcqweksn8n.duckdns.org/webhook/vertux-ai-trainer;
    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_set_header Host zxcqweksn8n.duckdns.org;
    proxy_set_header Origin $http_origin;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Content-Type $http_content_type;
    proxy_set_header Content-Length $http_content_length;
    proxy_ssl_server_name on;
    proxy_ssl_name zxcqweksn8n.duckdns.org;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_read_timeout 42s;
    proxy_connect_timeout 3s;
    proxy_buffering off;
    access_log off;
}
